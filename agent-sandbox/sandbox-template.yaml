apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: k8sgpt-diagnostic-template
spec:
  service: true
  podTemplate:
    spec:
      serviceAccountName: k8sgpt-readonly
      runtimeClassName: gvisor
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      nodeSelector:
        sandbox: gvisor
      initContainers:
        - name: k8sgpt-config-reset
          image: busybox:1.36
          command: ["/bin/sh", "-c", "rm -f /home/nonroot/.config/k8sgpt/k8sgpt.yaml"]
          volumeMounts:
            - name: k8sgpt-data
              mountPath: /home/nonroot/.config/k8sgpt
              subPath: config
        - name: k8sgpt-auth
          image: ghcr.io/k8sgpt-ai/k8sgpt:v0.4.19
          args:
            - auth
            - add
            - --backend=amazonbedrock
            - --model=us.amazon.nova-pro-v1:0
            - --providerRegion=us-west-2
          securityContext:
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: k8sgpt-data
              mountPath: /home/nonroot/.config/k8sgpt
              subPath: config
        - name: k8sgpt-set-default
          image: ghcr.io/k8sgpt-ai/k8sgpt:v0.4.19
          args:
            - auth
            - default
            - --provider=amazonbedrock
          securityContext:
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: k8sgpt-data
              mountPath: /home/nonroot/.config/k8sgpt
              subPath: config
      containers:
        - name: k8sgpt
          image: ghcr.io/k8sgpt-ai/k8sgpt:v0.4.19
          args: ["serve", "--port=8080", "--backend=amazonbedrock", "--http"]
          env:
            - name: AWS_REGION_NAME
              value: "us-west-2"
          securityContext:
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: k8sgpt-data
              mountPath: /home/nonroot/.config/k8sgpt
              subPath: config
            - name: k8sgpt-data
              mountPath: /home/nonroot/.cache/k8sgpt
              subPath: cache
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
  - metadata:
      name: k8sgpt-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi