apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent
rules:
  - apiGroups: ["apps", "batch", "networking.k8s.io", "storage.k8s.io", "policy", "autoscaling",
                "apiextensions.k8s.io", "scheduling.k8s.io", "rbac.authorization.k8s.io",
                "metrics.k8s.io", "coordination.k8s.io", "discovery.k8s.io",
                "admissionregistration.k8s.io", "apiregistration.k8s.io", "events.k8s.io",
                "certificates.k8s.io", "node.k8s.io", "flowcontrol.apiserver.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "services", "configmaps", "nodes",
                "persistentvolumeclaims", "persistentvolumes", "namespaces", "events",
                "serviceaccounts", "endpoints", "resourcequotas", "limitranges",
                "replicationcontrollers", "podtemplates", "componentstatuses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: ai-agent
  apiGroup: rbac.authorization.k8s.io
