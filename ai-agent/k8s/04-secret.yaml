# Template only - DO NOT fill in real values here or apply this file directly.
#
# Copy this file to k8s/secret.yaml (already gitignored - see .gitignore) and fill in real
# values there, then `kubectl apply -f k8s/secret.yaml`. Never commit the filled-in version.
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are only needed on non-EKS clusters. On EKS, prefer
# IRSA instead (see the commented annotation in 01-serviceaccount.yaml) and delete those two keys
# from your real secret.yaml entirely - boto3's default credential chain picks up IRSA
# automatically with no other change.
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
  namespace: ai-agent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  DATABASE_PASSWORD: "REPLACE_ME_WITH_A_STRONG_PASSWORD"
  # Optional: only needed if you want a live cost estimate alongside token counts - see .env.example.
  DIAGNOSTICS_MODEL_PRICE_INPUT_PER_1K: "0.0008"
  DIAGNOSTICS_MODEL_PRICE_OUTPUT_PER_1K: "0.0032"
  REMEDIATION_MODEL_PRICE_INPUT_PER_1K: "0.00024"
  REMEDIATION_MODEL_PRICE_OUTPUT_PER_1K: "0.00097"
---
# Postgres itself reads its own superuser password from this key (05-postgres.yaml references
# POSTGRES_PASSWORD, the standard postgres image env var) - kept as a separate Secret object so
# the Postgres StatefulSet doesn't need to know about AWS credentials at all.
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-postgres-secrets
  namespace: ai-agent
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_STRONG_PASSWORD" # must match DATABASE_PASSWORD above
