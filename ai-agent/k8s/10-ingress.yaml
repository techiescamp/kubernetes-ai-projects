apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-agent
  namespace: ai-agent
  annotations: {}
spec:
  ingressClassName: nginx
  rules:
    - host: ai-agent.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: ai-agent-backend, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: ai-agent-frontend, port: {number: 3000}}
