# ServiceAccount the backend pod runs as. Its RBAC permissions are granted in 02-rbac.yaml.
#
# AWS credentials for Bedrock resolve automatically via boto3's default credential chain
# (bedrock_clients.py:15) - no code change is needed for either path below:
#
#   - EKS (recommended): uncomment the annotation below and set it to an IAM role ARN that has
#     bedrock:InvokeModel permissions (IRSA). No static AWS keys ever touch the cluster.
#   - Any other cluster: leave the annotation out and instead mount AWS_ACCESS_KEY_ID /
#     AWS_SECRET_ACCESS_KEY from k8s/secret.yaml (see 04-secret.example.yaml) as env vars in
#     06-backend-deployment.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-agent
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/ai-agent-bedrock-role
