apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-agent-backend
  namespace: ai-agent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: ai-agent-backend}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-agent-frontend
  namespace: ai-agent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: ai-agent-frontend}
