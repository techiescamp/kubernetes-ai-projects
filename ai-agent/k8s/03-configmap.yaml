apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: ai-agent
data:
  AWS_REGION: "us-east-1"
  DIAGNOSTICS_MODEL_ID: "us.amazon.nova-pro-v1:0"
  REMEDIATION_MODEL_ID: "us.meta.llama4-maverick-17b-instruct-v1:0"
  LOG_LEVEL: "INFO"
  MAX_REMEDIATION_ATTEMPTS: "3"
  # Backend Service DNS name from 07-backend-service.yaml - allows the in-cluster frontend origin.
  ALLOWED_ORIGINS: "http://(localhost|127\\.0\\.0\\.1):\\d+|http://ai-agent-frontend(\\.ai-agent)?(\\.svc)?(\\.cluster\\.local)?:\\d+"
  # Non-secret half of the Postgres connection string - the password lives in secret.yaml.
  # Combined into DATABASE_URL via a shell-expanded env var in the backend Deployment.
  DATABASE_HOST: "ai-agent-postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ai_agent"
  DATABASE_USER: "ai_agent"
  # Frontend build-time env (frontend/Dockerfile ARG) - points the chat UI at the backend Service.
  NEXT_PUBLIC_BACKEND_URL: "http://ai-agent-backend:8000"
